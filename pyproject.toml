[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthsea"
version = "0.1.0"
description = "Reproducible multilingual synthetic instruction research pipeline"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.115",
  "jsonschema>=4.23",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pyarrow>=17.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
synthsea = "synthsea.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = "^tests/fixtures/"

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
